# Lit tests for the Intl plugin: the real libhermesintl, and the JS layer's
# shared operations in isolation. Run by check-intl, not check-hermes.

import os
import platform
import shutil
import sys

import lit.formats

config.name = "Hermes-Intl"
config.test_format = lit.formats.ShTest(execute_external=False)
config.suffixes = [".js"]
config.excludes = ["Inputs"]
config.test_source_root = os.path.dirname(__file__)

params = lit_config.params
config.test_exec_root = params["intl_test_exec_root"]
plugin = params["intl_plugin"]

# A substitution must come before any whose name is its prefix.
config.substitutions.append(("%hermes_jsi_shared", params["hermes_jsi_shared"]))
config.substitutions.append(("%hermesvm_lib", params["hermesvm_lib"]))
config.substitutions.append(("%hermes_default", params["hermes"]))
config.substitutions.append(("%hermesc", params["hermesc"]))
config.substitutions.append(("%hvm", params["hvm"]))
config.substitutions.append(("%shermes", params["shermes"]))
config.substitutions.append(
    ("%hermes", params["hermes"] + " -Xintl-plugin-path=" + plugin)
)
config.substitutions.append(("%FileCheck", params["FileCheck"]))
config.substitutions.append(("%python", '"%s"' % sys.executable))
config.substitutions.append(("%cmake", params["cmake"]))
config.substitutions.append(("%intl_plugin", plugin))
config.substitutions.append(("%intl_js", params["intl_js_dir"]))

# A command that lists the plugin's exports, one per line; the name its entry
# point has in that list; and the FileCheck prefix for the list's format. A
# Windows DLL is read by Inputs/coff-exports.py (the format follows the file,
# so a cross-built DLL can be checked on any host).
if plugin.lower().endswith(".dll"):
    config.substitutions.append(
        (
            "%list_exports",
            '"%s" "%s"'
            % (
                sys.executable,
                os.path.join(config.test_source_root, "Inputs", "coff-exports.py"),
            ),
        )
    )
    config.substitutions.append(("%intl_entry_symbol", "hermes_intl_get_entry"))
    config.substitutions.append(("%exports_prefix", "COFF"))
elif platform.system() == "Darwin":
    config.substitutions.append(("%list_exports", "nm -gU"))
    config.substitutions.append(("%intl_entry_symbol", "_hermes_intl_get_entry"))
    config.substitutions.append(("%exports_prefix", "NM"))
else:
    config.substitutions.append(("%list_exports", "nm -D -g --defined-only"))
    config.substitutions.append(("%intl_entry_symbol", "hermes_intl_get_entry"))
    config.substitutions.append(("%exports_prefix", "NM"))

if params.get("jsi_unstable", "").upper() in ("1", "ON", "TRUE", "YES"):
    config.available_features.add("jsi_unstable")
if platform.system() == "Linux":
    config.available_features.add("linux")
if platform.system() == "Darwin":
    config.available_features.add("darwin")
    # Built only on Apple platforms (test/unit/CMakeLists.txt).
    config.substitutions.append(
        (
            "%intl_defaults_probe",
            os.path.join(params["intl_unittests_dir"], "IntlDefaultsProbe"),
        )
    )
# Tests that read glibc's LD_DEBUG output.
if platform.libc_ver()[0] == "glibc":
    config.available_features.add("glibc")

# shermes runs the C compiler it was configured with unless CC says otherwise.
if "CC" in os.environ:
    config.environment["CC"] = os.environ["CC"]

# `not` and the other lit helpers live next to the Hermes tools.
config.environment["PATH"] = os.pathsep.join(
    [params["tools_dir"], config.environment.get("PATH", os.environ["PATH"])]
)
# Tests that configure a small CMake project with the Ninja generators.
if shutil.which("ninja", path=config.environment["PATH"]):
    config.available_features.add("ninja")
for var in ("ASAN_OPTIONS", "UBSAN_OPTIONS", "LSAN_OPTIONS", "HOME", "TMPDIR"):
    if var in os.environ:
        config.environment[var] = os.environ[var]
