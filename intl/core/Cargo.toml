[package]
name = "hermes_intl_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# ICU4X is pinned to 2.4 (CLDR 49): `~` keeps `cargo update` within 2.4.x.
icu = { version = "~2.4.0", features = ["sync"] }
icu_provider = "~2.4"
# Not used directly. icu 2.4 asks for it with a caret requirement, which a
# plain `cargo update` could satisfy with a later 2.x; this keeps it at 2.4.
icu_locale_core = "~2.4"
# Plural ranges (PluralRulesWithRanges, RawPluralOperands) and the compact
# decimal data need the `unstable` feature.
icu_plurals = { version = "~2.4", features = ["unstable"] }
icu_decimal = { version = "~2.4", features = ["unstable"] }
# The currency data structs (decision 4 of the Phase 3 plan), and the
# decimals the number data APIs take.
icu_experimental = "~0.7"
fixed_decimal = "~0.7"
# The items of ICU4X's currency and compact patterns, and the VarULE trait
# of the plural data that holds them.
icu_pattern = "~0.5.1"
zerovec = "~0.11"
# The key type of icu_experimental's dialect name map, at the version ICU4X
# 2.4 uses.
potential_utf = "~0.1.6"
# TryWriteable, which writes ICU4X's formatted date and time names.
writeable = "~0.6"
# The IANA time zone database, as TZif data that tz.rs reads. The exact
# version pins tzdb 2026e (rearguard, slim); a new tzdb is a new version.
jiff-tzdb = "=0.1.9"

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[profile.dev]
opt-level = 1
panic = "abort"

# ICU4X is unusably slow unoptimized; optimize dependencies even in Debug.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
