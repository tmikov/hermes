name: build-apple-slices-hermes

on: workflow_call

jobs:
  build_apple_slices_hermes:
    runs-on: macos-15
    env:
      IOS_DEPLOYMENT_TARGET: "15.1"
      XROS_DEPLOYMENT_TARGET: "1.0"
      MAC_DEPLOYMENT_TARGET: "10.15"
    strategy:
      fail-fast: false
      matrix:
        flavor: [Debug, Release]
        slice:
          [
            macosx,
            iphoneos,
            iphonesimulator,
            appletvos,
            appletvsimulator,
            catalyst,
            xros,
            xrsimulator,
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup xcode
        uses: ./.github/actions/setup-xcode
      - name: Install Rust and the ${{ matrix.slice }} targets
        shell: bash
        run: |
          # The Intl plugin (hermesintl.framework) needs Rust 1.95 or newer
          # (tvOS and visionOS) and the std of each target of the slice.
          if ! command -v rustup; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add $(./utils/build-apple-framework.sh rust_targets "${{ matrix.slice }}")
      - name: Restore HermesC Artifact
        uses: actions/download-artifact@v4
        with:
          name: hermesc-apple
          path: ./build_host_hermesc
      - name: Build the Hermes ${{ matrix.slice }} frameworks
        shell: bash
        run: |
          SLICE=${{ matrix.slice }}
          FLAVOR=${{ matrix.flavor }}
          FINAL_PATH=build_"$SLICE"_"$FLAVOR"
          echo "Final path for this slice is: $FINAL_PATH"

          # HermesC is used to build hermes, so it has to be executable
          chmod +x ./build_host_hermesc/bin/hermesc

          echo "[HERMES] Building Hermes for $SLICE"

          BUILD_TYPE="${{ matrix.flavor }}" ./utils/build-apple-framework.sh "$SLICE"

          echo "Moving from build_$SLICE to $FINAL_PATH"
          mv build_"$SLICE" "$FINAL_PATH"

          # check whether everything is there: Hermes and the Intl plugin
          for FRAMEWORK in hermesvm hermesintl; do
            if [[ -d "$FINAL_PATH/lib/$FRAMEWORK.framework" ]]; then
              echo "Successfully built $FRAMEWORK.framework for $SLICE in $FLAVOR"
            else
              echo "Failed to built $FRAMEWORK.framework for $SLICE in $FLAVOR"
              exit 1
            fi

            if [[ -d "$FINAL_PATH/lib/$FRAMEWORK.framework.dSYM" ]]; then
              echo "Successfully built $FRAMEWORK.framework.dSYM for $SLICE in $FLAVOR"
            else
              echo "Failed to built $FRAMEWORK.framework.dSYM for $SLICE in $FLAVOR"
              echo "Please try again"
              exit 1
            fi
          done
      - name: Compress slices to preserve Symlinks
        shell: bash
        run: |
          tar -czv -f build_${{ matrix.slice }}_${{ matrix.flavor }}.tar.gz build_${{ matrix.slice }}_${{ matrix.flavor }}
      - name: Upload Artifact for Slice (${{ matrix.slice }}, ${{ matrix.flavor }})
        uses: actions/upload-artifact@v4.3.4
        with:
          name: slice-${{ matrix.slice }}-${{ matrix.flavor }}
          path: ./build_${{ matrix.slice }}_${{ matrix.flavor }}.tar.gz
