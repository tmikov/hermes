[package]
name = "parser"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "ast-dump"
path = "src/bin/ast_dump.rs"

[[bin]]
name = "json-parse-dump"
path = "src/bin/json_parse_dump.rs"

[[bin]]
name = "gen-json"
path = "src/bin/gen_json.rs"

[lints.rust]
unsafe_code = "deny"   # the cursor module (later) gets a scoped #[allow]; token tables are unsafe-free

[dependencies]
support = { path = "../support" }
atom_table = { path = "../atom_table" }
unicode = { path = "../unicode" }
ast = { path = "../ast" }
bumpalo = "3.16"
