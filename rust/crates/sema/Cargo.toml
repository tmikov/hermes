[package]
name = "sema"
version = "0.0.0"
edition = "2021"
publish = false

[lints.rust]
unsafe_code = "forbid"

[features]
dump-bin = ["dep:hermes_parser", "dep:hermes_command_line"]

# The Rust side of the `sema_differential` oracle test. Gated on `dump-bin`
# because it needs the parser + the command-line option parser; the test
# itself is `#![cfg(feature = "dump-bin")]` for the same reason (a test may
# not depend on its own crate's features any other way).
[[bin]]
name = "sema-dump"
path = "src/bin/sema_dump.rs"
required-features = ["dump-bin"]

[dependencies]
hermes_support = { path = "../support", package = "hermes-support" }
hermes_atom_table = { path = "../atom_table", package = "hermes-atom-table" }
hermes_ast = { path = "../ast", package = "hermes-ast" }
hermes_parser = { path = "../parser", package = "hermes-parser", optional = true }
hermes_command_line = { path = "../command_line", package = "hermes-command-line", optional = true }

[dev-dependencies]
hermes_parser = { path = "../parser", package = "hermes-parser" }
