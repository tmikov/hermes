[package]
name = "tools"
version = "0.0.0"
edition = "2021"
publish = false
description = "Unpublished command-line drivers for the Rust Hermes front-end (dump/differential tools)."

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "ast-dump"
path = "src/bin/ast_dump.rs"

[[bin]]
name = "json-parse-dump"
path = "src/bin/json_parse_dump.rs"

[[bin]]
name = "gen-json"
path = "src/bin/gen_json.rs"

[[bin]]
name = "preparse-dump"
path = "src/bin/preparse_dump.rs"

[dependencies]
hermes_support = { path = "../support", package = "hermes-support" }
hermes_atom_table = { path = "../atom_table", package = "hermes-atom-table" }
hermes_ast = { path = "../ast", package = "hermes-ast" }
hermes_parser = { path = "../parser", package = "hermes-parser" }
command_line = { path = "../command_line" }
bumpalo = "3.16"
