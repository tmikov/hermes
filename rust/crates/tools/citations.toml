# Citation resolution config for the `citations` checker (crates/tools).
#
# Start at src/citations/README.md if you have not met this tool before: it
# explains what a citation is, how to run check/remap/bless, and the debt.
#
# The Rust port cites the exact C++ lines each piece was ported from, e.g.
# `//! visit(ClassDeclarationNode *) (cpp:891-907)`. This file is the ONLY
# place that says which C++ file a citation refers to: the checker never reads
# the prose of a module header to guess.
#
# Four tables, all consulted in this order for a given citation:
#
#   [unresolved]     keys that are deliberately NOT checked (reported as
#                    skipped, with the reason, on every run — never silently
#                    dropped).
#   [site_override]  one exact citation site -> the C++ file it really means.
#   [qualified]      cited basename -> repo-relative path, for citations that
#                    name a file (`SemanticResolver.cpp:891-907`).
#   [bare]           Rust-path glob -> the C++ file a BARE `cpp:NNN` means in
#                    those Rust files. FIRST MATCH WINS, so more specific
#                    globs must come first. `*` does not cross `/`.
#
# Site keys are `<rust path relative to rust/>#<citation text as written>`,
# with runs of whitespace inside the citation collapsed to one space (a
# citation may wrap across two comment lines). Example:
#   "crates/sema/src/check_implicit_return.rs#cpp:1969-1974"
#
# A citation written as a bare `:NNN` inherits the file named nearest before
# it on the same logical comment line (see `scan.rs`). That is the one
# guessed part of resolution, so where the guess is wrong the site gets a
# [site_override] below.
#
# Adding an entry: a new cited basename goes in [qualified] (run
# `cargo run -p tools --bin citations -- check`; unmapped basenames are
# listed). A new module family that uses bare `cpp:` goes in [bare] — and the
# mapping MUST be verified by reading 2-3 of that module's citations against
# the C++ file before it is added, because a wrong mapping blesses nonsense.

# Sites and names that are deliberately not checked, with the reason. Keys are
# a site key, a cited basename, or a Rust-path glob.
[unresolved]
"crates/tools/src/citations/*.rs" = "the checker's own sources: every `cpp:NNN` in them is a documentation example or a scanner unit-test fixture, not a citation of the C++ tree."
"crates/sema/tests/check_implicit_return.rs#cpp:266-257" = "reversed range (end < start): a transposition of CheckImplicitReturn.cpp:257-266, `checkTerminationTryStatement`. Pre-existing; repairing citations is out of scope for the checker."
"crates/tools/src/bin/sema_dump.rs#CompilerDriver.cpp:2105- 2080" = "reversed range (end < start): the cited construct `if (!ast) { ... } return ParsingFailed;` is CompilerDriver.cpp:2105-2109. Pre-existing."

# One site whose bare `cpp:` means a different C++ file than its module's
# [bare] entry. Every one of these was found by the past-EOF check, not by
# guessing, and each was confirmed by reading the cited lines.
[site_override]
# `visitFunctionBodyAfterParamsVisited`, the single caller of the analysis.
"crates/sema/src/check_implicit_return.rs#cpp:1969-1974" = "lib/Sema/SemanticResolver.cpp"
"crates/sema/src/check_implicit_return.rs#cpp:1969" = "lib/Sema/SemanticResolver.cpp"
# The quoted "CheckImplicitReturn relies on break and continue..." comment.
"crates/sema/tests/check_implicit_return.rs#cpp:1969-1972" = "lib/Sema/SemanticResolver.cpp"
# `SemanticResolver::processPromotedFuncDecls`, the caller of the promoter.
"crates/sema/src/resolver/promoter.rs#cpp:2159-2171" = "lib/Sema/SemanticResolver.cpp"
# The `if (blockBody)` guard in `visitFunctionLikeInFunctionContext`.
"crates/sema/src/resolver/promoter.rs#cpp:1934" = "lib/Sema/SemanticResolver.cpp"
# `SemanticResolver::extractIdentsFromDecl`, contrasted with the promoter's.
"crates/sema/src/resolver/promoter.rs#cpp:2292-2382" = "lib/Sema/SemanticResolver.cpp"
# Four `:NNN` citations whose implicit file is NOT the one named nearest
# before them (the scanner's rule); each was read and confirmed by hand.
# `resolveCommonJSAST` and its inline overload, and `semDump` — the prose
# names `SemanticResolver.h` in between, but the list is of `SemResolve.h`
# entry points.
"crates/sema/src/resolve.rs#:86" = "include/hermes/Sema/SemResolve.h"
"crates/sema/src/resolve.rs#:93" = "include/hermes/Sema/SemResolve.h"
"crates/sema/src/resolve.rs#:111" = "include/hermes/Sema/SemResolve.h"
# `visit(MatchStatementNode *)`/`visit(MatchExpressionNode *)` in the header's
# visit inventory; the nearest file named before it is `ESTree.def`.
"crates/sema/src/resolver/mod.rs#:295-296" = "lib/Sema/SemanticResolver.h"

# Cited basename -> repo-relative path. Shorthands (`flow.cpp`) included.
# Where a basename exists more than once in the tree the choice was confirmed
# by reading the cited lines; those entries carry a comment.
