# Rust-path glob -> the C++ file a bare `cpp:NNN` means there. FIRST MATCH
# WINS. Every entry below was verified by reading citations from that glob
# against the C++ file (see the task-1 report for the sampling evidence).
[bare]
# The promoter is a port of ScopedFunctionPromoter.{h,cpp}; the class itself
# is defined in the .cpp, so header-looking citations land there too.
"crates/sema/src/resolver/promoter.rs" = "lib/Sema/ScopedFunctionPromoter.cpp"
# Everything else under resolver/ is one C++ file split across Rust modules.
"crates/sema/src/resolver/*.rs" = "lib/Sema/SemanticResolver.cpp"
"crates/sema/src/dump.rs" = "lib/Sema/SemResolve.cpp"
"crates/sema/src/resolve.rs" = "lib/Sema/SemResolve.cpp"
"crates/sema/src/dump_context.rs" = "lib/Sema/SemContext.cpp"
"crates/sema/src/decl_collector.rs" = "lib/Sema/DeclCollector.cpp"
"crates/sema/src/check_implicit_return.rs" = "lib/Sema/CheckImplicitReturn.cpp"
"crates/sema/tests/resolver.rs" = "lib/Sema/SemanticResolver.cpp"
"crates/sema/tests/check_implicit_return.rs" = "lib/Sema/CheckImplicitReturn.cpp"
"crates/sema/tests/decl_collector.rs" = "lib/Sema/DeclCollector.cpp"
"crates/parser/src/js/flow/*.rs" = "lib/Parser/JSParserImpl-flow.cpp"
"crates/parser/src/js/ts/*.rs" = "lib/Parser/JSParserImpl-ts.cpp"
"crates/parser/src/js/jsx.rs" = "lib/Parser/JSParserImpl-jsx.cpp"
